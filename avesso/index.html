<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Avesso</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2310131c'/%3E%3Cpath d='M50 86 C30 86 20 70 20 54 C20 36 36 14 50 14 C64 14 80 36 80 54 C80 70 70 86 50 86 Z' fill='%23f3eee2' transform='rotate(180 50 50)'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../desafio.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root { --noite: #10131c; --papel: #f3eee2; --tinta: #1b1a17; --apagado: #8c90a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow: hidden; color: var(--papel); background: var(--noite);
    font-family: "Cormorant Garamond", Georgia, serif; transition: background 1s ease, color 1s ease;
  }
  body.virou { background: var(--papel); color: var(--tinta); }
  .tela {
    position: fixed; inset: 0; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; text-align: center; transition: opacity .8s ease;
  }
  .tela[hidden] { display: none; }
  #frase { margin: 0; max-width: 16em; font-size: clamp(1.9rem, 8vw, 3.2rem); font-style: italic; font-weight: 500; line-height: 1.2; }
  #nota { margin: 0; min-height: 1.4em; color: var(--apagado); font-size: 1.15rem; }
  #nota a { color: inherit; }
  #permitir {
    font: inherit; font-size: 1.15rem; color: var(--papel); background: transparent; cursor: pointer;
    border: 1px solid var(--apagado); border-radius: 999px; padding: 10px 24px;
  }
  #permitir[hidden] { display: none; }
  #permitir:focus-visible { outline: 2px solid var(--papel); outline-offset: 3px; }

  /* quando vira: a tela fica clara e a senha aparece de cabeça pra baixo */
  #segredo { opacity: 0; transition: opacity 1s ease .2s; }
  body.virou #segredo { opacity: 1; }
  .ovo { width: 76px; height: 100px; }
  .ovo path { fill: #fffdf7; stroke: var(--tinta); stroke-width: 2; }
  #recompensa { margin: 0; max-width: 18em; font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 500; line-height: 1.3; white-space: pre-line; }
  #recompensa .destaque {
    display: inline-block; margin-top: 10px; font-size: 1.5em; font-weight: 700; overflow-wrap: anywhere;
    user-select: all; -webkit-user-select: all;
  }
  @media (prefers-reduced-motion: reduce) { body, .tela, #segredo { transition: none; } }
</style>
</head>
<body>
<div id="inicio" class="tela">
  <p id="frase">Algumas coisas são melhores vistas de cabeça pra baixo</p>
  <button id="permitir" type="button" hidden>Permitir o sensor de movimento</button>
  <p id="nota" aria-live="polite"></p>
</div>
<div id="segredo" class="tela" hidden>
  <svg class="ovo" viewBox="0 0 76 100" aria-hidden="true"><path d="M38 2 C56 2 74 34 74 60 C74 84 58 98 38 98 C18 98 2 84 2 60 C2 34 20 2 38 2 Z"/></svg>
  <p id="recompensa" aria-live="polite"></p>
</div>

<script>
(() => {
  const SLUG = "avesso";                       // apelido do desafio no Supabase (tabela desafios)
  const CODIGO = "de cabeca pra baixo";        // só libera a recompensa: a senha nunca fica nesta página
  const TEMPO_VIRADO = 500;                    // ms de cabeça pra baixo antes de abrir

  const $ = id => document.getElementById(id);
  const nota = $("nota"), inicio = $("inicio"), segredo = $("segredo"), botao = $("permitir");
  let liberado = false, pedindo = false, virado = false, viradoDesde = 0, esperaDesvirar = false, sensorLigado = false, mostrando = false;

  // a tela do celular costuma não girar sozinha para 180°; se girou, o navegador avisa o ângulo aqui
  const anguloTela = () => {
    const a = screen.orientation ? screen.orientation.angle : window.orientation;
    return ((Number(a) || 0) + 360) % 360;
  };

  // a senha fica de cabeça pra baixo para quem segura o celular virado: se a tela girou junto, desfaz o giro
  function ajustarGiro() {
    segredo.style.transform = anguloTela() === 180 ? "rotate(180deg)" : "";
  }

  function mostrarSenha() {
    if (mostrando) return;
    mostrando = true;
    nota.textContent = "";
    segredo.hidden = false;
    inicio.hidden = true;
    ajustarGiro();
    void segredo.offsetWidth;
    document.body.classList.add("virou");
  }

  // desvirou o celular para tentar ler: a senha some e volta a frase
  function esconderSenha() {
    if (!mostrando) return;
    mostrando = false;
    segredo.hidden = true;
    inicio.hidden = false;
    document.body.classList.remove("virou");
  }

  async function abrir() {
    if (liberado) return mostrarSenha();
    if (pedindo) return;
    pedindo = true;
    try {
      const r = await Desafio.responder(SLUG, CODIGO);
      if (r.status === "certo") {
        liberado = true;
        $("recompensa").innerHTML = Desafio.textoRecompensa(r.recompensa_texto);
        if (virado) mostrarSenha();
      } else if (r.status === "aguarde") {
        nota.textContent = "Calma. Espere um minuto e tente de novo.";
      } else {
        nota.textContent = "Esta página ainda não abriu.";
      }
    } catch (e) {
      nota.textContent = "Falha na conexão. Vire o celular de novo.";
    }
    pedindo = false;
    esperaDesvirar = !liberado;     // deu errado: só tenta de novo depois de desvirar e virar outra vez
  }

  function atualizarVirado(agora) {
    virado = agora;
    ajustarGiro();
    if (!agora) { viradoDesde = 0; esperaDesvirar = false; esconderSenha(); return; }
    if (esperaDesvirar) return;
    if (!viradoDesde) viradoDesde = performance.now();
    if (performance.now() - viradoDesde >= TEMPO_VIRADO) abrir();
  }

  // beta perto de -90 = celular em pé, de cabeça pra baixo (funciona mesmo com a rotação da tela travada)
  function aoMover(e) {
    if (e.beta === null || e.gamma === null) return;
    sensorLigado = true;
    botao.hidden = true;
    // com a senha na tela a margem é maior, para uma tremida da mão não tirar o jogador dela
    atualizarVirado(mostrando
      ? e.beta <= -20 && e.beta >= -160 && Math.abs(e.gamma) < 65
      : e.beta <= -45 && e.beta >= -135 && Math.abs(e.gamma) < 50);
  }
  // escuta desde o começo e de novo depois da permissão (o iPhone só entrega a leitura depois dela)
  const ouvirSensor = () => {
    removeEventListener("deviceorientation", aoMover);
    addEventListener("deviceorientation", aoMover);
  };
  const aoGirarTela = () => {
    if (anguloTela() === 180) atualizarVirado(true);
    else if (!sensorLigado) atualizarVirado(false);
    ajustarGiro();
  };

  // ---- início ----
  (async () => {
    try {
      const sessao = await Desafio.sessao();
      if (!sessao) {
        nota.innerHTML = `<a href="/">Entre na sua conta</a> para continuar.`;
        return;
      }
      const st = await Desafio.status(SLUG);
      if (!st.existe) { nota.textContent = "Esta página ainda não abriu."; return; }
    } catch (e) {
      nota.textContent = "Falha na conexão. Recarregue a página.";
      return;
    }

    if (screen.orientation) screen.orientation.addEventListener("change", aoGirarTela);
    addEventListener("orientationchange", aoGirarTela);

    aoGirarTela();
    if (!matchMedia("(pointer: coarse)").matches) nota.textContent = "Abra esta página no celular.";
    ouvirSensor();
    setInterval(() => { if (virado) atualizarVirado(true); }, 100);   // o sensor só avisa quando mexe: garante o tempo com o celular parado

    // alguns navegadores pedem permissão para o sensor; o iPhone só libera depois de um toque do jogador
    if (!window.DeviceOrientationEvent || typeof DeviceOrientationEvent.requestPermission !== "function") return;
    try {
      if (await DeviceOrientationEvent.requestPermission() === "granted") return ouvirSensor();
    } catch (e) { /* precisa de um toque: segue para o botão */ }
    botao.hidden = sensorLigado;
    botao.addEventListener("click", async () => {
      try {
        if (await DeviceOrientationEvent.requestPermission() === "granted") { botao.hidden = true; nota.textContent = ""; ouvirSensor(); }
        else nota.textContent = "Sem o sensor não dá. Feche esta aba, abra de novo e permita.";
      } catch (e) { nota.textContent = "Não consegui ligar o sensor. Recarregue a página."; }
    });
  })();
})();
</script>
</body>
</html>
